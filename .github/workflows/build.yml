name: Build MN Shot APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip newest zip
        run: |
          ZIP=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using zip: $ZIP"
          unzip -q "$ZIP"

      - name: Verify new code is inside
        working-directory: MN_Shot_Studio
        run: |
          grep -q "v4.0 NEW" app/src/main/assets/index.html
          test -f app/src/main/assets/studio5.js
          echo "NEW CODE CONFIRMED"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Point Gradle to SDK
        working-directory: MN_Shot_Studio
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: MN_Shot_Studio
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp MN_Shot_Studio/app/build/outputs/apk/debug/app-debug.apk MN-Cut-v4-run-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-Cut-v4-run-${{ github.run_number }}
          path: MN-Cut-v4-run-${{ github.run_number }}.apk
          if-no-files-found: error
